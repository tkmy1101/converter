<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マテリアル変換ツール</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
.app{padding:1rem;font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;min-height:100vh;max-width:480px;margin:0 auto;transition:background 0.3s;}
.app.theme-a{background:#0d1117;}
.app.theme-b{background:#0d1a12;}
.sl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
.theme-a .sl{color:#2d5a8e;}
.theme-b .sl{color:#1a5c3a;}
.card{border-radius:12px;padding:1rem 1.125rem;margin-bottom:10px;border:1px solid;transition:background 0.3s,border-color 0.3s;}
.theme-a .card{background:#0f1923;border-color:#1a3a5c;}
.theme-b .card{background:#0f1a10;border-color:#1a4a25;}
h1{font-size:17px;font-weight:700;margin-bottom:1.25rem;padding-bottom:12px;display:flex;align-items:center;gap:10px;transition:color 0.3s,border-color 0.3s;}
.theme-a h1{color:#7ab8f5;border-bottom:1px solid #1a3a5c;}
.theme-b h1{color:#6dd98c;border-bottom:1px solid #1a4a25;}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;transition:background 0.3s;}
.theme-a .dot{background:#378add;}
.theme-b .dot{background:#2ec4a0;}
.mat-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;}
.mat-btn{padding:11px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid;transition:all 0.2s;}
.theme-a .mat-btn{background:#0f1923;border-color:#1a3a5c;color:#4a7aaa;}
.theme-b .mat-btn{background:#0f1a10;border-color:#1a4a25;color:#3a8a5a;}
.theme-a .mat-btn.active{background:#0d2a4a;border-color:#378add;color:#7ab8f5;}
.theme-b .mat-btn.active{background:#0a2a15;border-color:#2ec4a0;color:#6dd98c;}
.rate-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.ri{display:flex;flex-direction:column;gap:5px;}
.ri label{font-size:10px;font-weight:500;}
.theme-a .ri label{color:#4a7aaa;}
.theme-b .ri label{color:#3a8a5a;}
.ri-row{display:flex;gap:3px;}
input[type=number]{border-radius:8px;font-size:15px;padding:8px 6px;text-align:center;font-family:inherit;width:100%;border:1px solid;transition:background 0.3s,border-color 0.3s,color 0.3s;-moz-appearance:textfield;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
input[type=number]:focus{outline:none;}
input[type=number]:disabled{opacity:0.25;pointer-events:none;}
.theme-a input[type=number]{background:#071220;border-color:#1a3a5c;color:#c8dcf0;}
.theme-b input[type=number]{background:#071507;border-color:#1a4a25;color:#b0e8c0;}
.nb{padding:6px 5px;border-radius:8px;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;border:1px solid;transition:all 0.15s;}
.theme-a .nb{background:#071220;border-color:#1a3a5c;color:#4a7aaa;}
.theme-b .nb{background:#071507;border-color:#1a4a25;color:#3a8a5a;}
.nb.on{background:rgba(248,113,113,0.1);border-color:rgba(248,113,113,0.4);color:#f87171;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.fi{display:flex;flex-direction:column;gap:5px;}
.fi label{font-size:10px;font-weight:500;}
.theme-a .fi label{color:#4a7aaa;}
.theme-b .fi label{color:#3a8a5a;}
.possess-row{display:flex;align-items:center;gap:10px;}
.possess-row input{flex:1;font-size:20px;padding:10px 12px;text-align:left;}
.possess-row span{font-size:12px;white-space:nowrap;}
.theme-a .possess-row span{color:#4a7aaa;}
.theme-b .possess-row span{color:#3a8a5a;}
.result-grid{display:grid;gap:8px;margin-bottom:12px;}
.rc{border-radius:10px;padding:12px 8px;text-align:center;border:1px solid;transition:background 0.3s,border-color 0.3s;}
.theme-a .rc{background:#071220;border-color:#1a3a5c;}
.theme-b .rc{background:#071507;border-color:#1a4a25;}
.rl{font-size:10px;margin-bottom:4px;font-weight:600;}
.theme-a .rl{color:#378add;}
.theme-b .rl{color:#2ec4a0;}
.rv{font-size:24px;font-weight:700;}
.theme-a .rv{color:#c8dcf0;}
.theme-b .rv{color:#b0e8c0;}
.rsub{font-size:10px;margin-top:3px;}
.rg{font-size:11px;margin-top:2px;color:#f5c842;}
.ok{color:#4ade80;}.ng{color:#f87171;}.mu{color:#333;}
.divider{border:none;border-top:1px solid;margin:12px 0;}
.theme-a .divider{border-color:#1a3a5c;}
.theme-b .divider{border-color:#1a4a25;}
.sr{display:flex;justify-content:space-between;align-items:center;padding:5px 0;}
.sr span{font-size:13px;}
.theme-a .sr span{color:#4a7aaa;}
.theme-b .sr span{color:#3a8a5a;}
.sv{font-size:14px;font-weight:700;}
.note{font-size:11px;margin-top:8px;text-align:center;}
.theme-a .note{color:#2d5a8e;}
.theme-b .note{color:#1a5c3a;}
.big-metric{border-radius:10px;padding:14px;margin-bottom:8px;text-align:center;border:1px solid;transition:background 0.3s,border-color 0.3s;}
.theme-a .big-metric{background:#071220;border-color:#378add;}
.theme-b .big-metric{background:#071507;border-color:#2ec4a0;}
.bm-label{font-size:10px;margin-bottom:4px;font-weight:600;}
.theme-a .bm-label{color:#378add;}
.theme-b .bm-label{color:#2ec4a0;}
.bm-val{font-size:28px;font-weight:700;transition:color 0.3s;}
.theme-a .bm-val{color:#7ab8f5;}
.theme-b .bm-val{color:#6dd98c;}
.bm-sub{font-size:11px;margin-top:4px;}
.theme-a .bm-sub{color:#4a7aaa;}
.theme-b .bm-sub{color:#3a8a5a;}
.buy-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.buy-metric{border-radius:10px;padding:10px;text-align:center;border:1px solid;transition:background 0.3s,border-color 0.3s;}
.theme-a .buy-metric{background:#071220;border-color:#1a3a5c;}
.theme-b .buy-metric{background:#071507;border-color:#1a4a25;}
.bml{font-size:10px;margin-bottom:3px;font-weight:600;}
.theme-a .bml{color:#4a7aaa;}
.theme-b .bml{color:#3a8a5a;}
.bmv{font-size:16px;font-weight:700;}
.theme-a .bmv{color:#c8dcf0;}
.theme-b .bmv{color:#b0e8c0;}
.profit-full{border-radius:10px;padding:12px;text-align:center;border:1px solid;margin-bottom:8px;transition:background 0.3s,border-color 0.3s;}
.theme-a .profit-full{background:#071220;border-color:#1a3a5c;}
.theme-b .profit-full{background:#071507;border-color:#1a4a25;}
.rec-box{border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.6;font-weight:500;border:1px solid;}
.rec-box.profit{background:rgba(74,222,128,0.1);border-color:rgba(74,222,128,0.3);color:#4ade80;}
.rec-box.loss{background:rgba(251,191,36,0.1);border-color:rgba(251,191,36,0.3);color:#fbbf24;}
.theme-a .rec-box.zero{background:#071220;border-color:#1a3a5c;color:#4a7aaa;}
.theme-b .rec-box.zero{background:#071507;border-color:#1a4a25;color:#3a8a5a;}
.gold-text{color:#f5c842;}
</style>
</head>
<body>
<div class="app theme-a" id="app">

<h1><span class="dot"></span><span id="title-text">マテリアル変換ツール — A</span></h1>

<p class="sl">マテリアル選択</p>
<div class="mat-tabs">
  <button class="mat-btn active" id="btnA" onclick="selectMat('A')">マテリアル A</button>
  <button class="mat-btn" id="btnB" onclick="selectMat('B')">マテリアル B</button>
</div>

<div class="card">
  <p class="sl">今日のレート（変換に必要な個数）</p>
  <div class="rate-grid">
    <div class="ri"><label>大 に必要</label><div class="ri-row"><input type="number" id="rL" min="1" value="10" oninput="calc()"><button class="nb" id="nL" onclick="toggleNone('L')">なし</button></div></div>
    <div class="ri"><label>中 に必要</label><div class="ri-row"><input type="number" id="rM" min="1" value="5" oninput="calc()"><button class="nb" id="nM" onclick="toggleNone('M')">なし</button></div></div>
    <div class="ri"><label>小 に必要</label><div class="ri-row"><input type="number" id="rS" min="1" value="2" oninput="calc()"><button class="nb" id="nS" onclick="toggleNone('S')">なし</button></div></div>
  </div>
</div>

<div class="card">
  <p class="sl">変換後のゴールド価値</p>
  <div class="rate-grid">
    <div class="ri"><label>大 (G)</label><input type="number" id="gL" min="0" value="100" oninput="calc()"></div>
    <div class="ri"><label>中 (G)</label><input type="number" id="gM" min="0" value="40" oninput="calc()"></div>
    <div class="ri"><label>小 (G)</label><input type="number" id="gS" min="0" value="10" oninput="calc()"></div>
  </div>
</div>

<div class="card">
  <p class="sl">マテリアル購入設定</p>
  <div class="two-col">
    <div class="fi"><label>購入コスト (G/回)</label><input type="number" id="buyCost" min="1" value="50" oninput="calc()"></div>
    <div class="fi"><label>購入数 (個/回)</label><input type="number" id="buyAmt" min="1" value="5" oninput="calc()"></div>
  </div>
</div>

<div class="card">
  <p class="sl">現在の所持数</p>
  <div class="possess-row">
    <input type="number" id="possess" min="0" value="0" oninput="calc()">
    <span id="plabel">個（マテリアル A）</span>
  </div>
</div>

<div class="card">
  <p class="sl">変換結果（所持分のみ）</p>
  <div class="result-grid" id="res-grid"></div>
  <hr class="divider">
  <p class="sl">不足数</p>
  <div id="shortage-area"></div>
  <p class="note" id="remain-note"></p>
</div>

<div class="card">
  <p class="sl">購入最適化</p>
  <div class="big-metric">
    <div class="bm-label">最適購入回数</div>
    <div class="bm-val" id="opt-times">—</div>
    <div class="bm-sub" id="opt-sub"></div>
  </div>
  <div class="buy-grid">
    <div class="buy-metric"><div class="bml">購入コスト合計</div><div class="bmv" id="opt-cost">—</div></div>
    <div class="buy-metric"><div class="bml">変換後ゴールド</div><div class="bmv gold-text" id="opt-gold">—</div></div>
  </div>
  <div class="profit-full">
    <div class="bml">純利益（変換G − 購入コスト）</div>
    <div class="bmv" id="opt-profit">—</div>
  </div>
  <div class="rec-box zero" id="rec-box">入力すると推奨が表示されます</div>
</div>

</div>
<script>
let mat='A';
const none={L:false,M:false,S:false};
const tiers=['L','M','S'];
const names={L:'大',M:'中',S:'小'};

function selectMat(m){
  mat=m;
  document.getElementById('app').className='app theme-'+(m==='A'?'a':'b');
  document.getElementById('btnA').className='mat-btn'+(m==='A'?' active':'');
  document.getElementById('btnB').className='mat-btn'+(m==='B'?' active':'');
  document.getElementById('plabel').textContent='個（マテリアル '+m+'）';
  document.getElementById('title-text').textContent='マテリアル変換ツール — '+m;
  calc();
}

function toggleNone(t){
  none[t]=!none[t];
  document.getElementById('n'+t).className='nb'+(none[t]?' on':'');
  document.getElementById('r'+t).disabled=none[t];
  calc();
}

function getConvertResult(total){
  const rates={},golds={};
  tiers.forEach(t=>{
    rates[t]=none[t]?null:(parseInt(document.getElementById('r'+t).value)||null);
    golds[t]=parseInt(document.getElementById('g'+t).value)||0;
  });
  const active=tiers.filter(t=>rates[t]!==null);
  let rem=total,g=0;
  const counts={};
  active.forEach(t=>{counts[t]=Math.floor(rem/rates[t]);g+=counts[t]*golds[t];rem=rem-counts[t]*rates[t];});
  return{g,rem,counts,rates,golds,active};
}

function calc(){
  const p=parseInt(document.getElementById('possess').value)||0;
  const buyCost=parseInt(document.getElementById('buyCost').value)||0;
  const buyAmt=parseInt(document.getElementById('buyAmt').value)||1;
  const base=getConvertResult(p);
  const active=base.active;

  const gridEl=document.getElementById('res-grid');
  const cols=active.length||1;
  gridEl.style.gridTemplateColumns=cols===1?'1fr':cols===2?'1fr 1fr':'1fr 1fr 1fr';
  let gridHTML='';
  tiers.forEach(t=>{
    if(none[t])return;
    const c=base.counts[t]||0;
    const gv=c*(parseInt(document.getElementById('g'+t).value)||0);
    gridHTML+=`<div class="rc"><div class="rl">${names[t]}</div><div class="rv">${c}</div><div class="rg">${gv.toLocaleString()}G</div><div class="rsub">${c>0?'<span class="ok">変換可</span>':'<span class="ng">不足</span>'}</div></div>`;
  });
  gridEl.innerHTML=gridHTML||'<div class="rc" style="opacity:.3"><div class="rl">—</div></div>';

  let shHTML='';
  if(active.length===0){
    shHTML='<div class="sr"><span class="mu">変換項目がありません</span></div>';
  } else {
    let rem2=p;
    active.forEach(t=>{
      const c=base.counts[t]||0;
      if(c>0){shHTML+=`<div class="sr"><span>${names[t]}</span><span class="sv ok">変換できます</span></div>`;}
      else{const sh=base.rates[t]-rem2;shHTML+=`<div class="sr"><span>${names[t]} に変換するには</span><span class="sv ng">あと ${Math.max(0,sh)} 個</span></div>`;}
      rem2=rem2-c*base.rates[t];
    });
  }
  document.getElementById('shortage-area').innerHTML=shHTML;
  document.getElementById('remain-note').textContent=base.rem>0?`変換後の余り: ${base.rem} 個`:active.length>0?'余りなし':'';

  if(!buyCost||!buyAmt||active.length===0){
    document.getElementById('opt-times').textContent='—';
    document.getElementById('opt-sub').textContent='';
    document.getElementById('opt-cost').textContent='—';
    document.getElementById('opt-gold').textContent='—';
    document.getElementById('opt-profit').textContent='—';
    document.getElementById('opt-profit').style.color='';
    document.getElementById('rec-box').className='rec-box zero';
    document.getElementById('rec-box').textContent='購入設定とレートを入力してください';
    return;
  }

  let bestProfit=-Infinity,bestN=0;
  for(let n=0;n<=300;n++){
    const{g}=getConvertResult(p+n*buyAmt);
    const profit=g-n*buyCost;
    if(profit>bestProfit){bestProfit=profit;bestN=n;}
  }

  const bestTotal=p+bestN*buyAmt;
  const{g:bestG,rem:bestRem}=getConvertResult(bestTotal);
  const bestCost=bestN*buyCost;

  document.getElementById('opt-times').textContent=bestN===0?'購入不要':bestN+'回';
  document.getElementById('opt-sub').textContent=bestN>0?`+${bestN*buyAmt}個（所持合計 ${bestTotal}個）`:'現在の所持数で最適';
  document.getElementById('opt-cost').textContent=bestCost.toLocaleString()+'G';
  document.getElementById('opt-gold').textContent=bestG.toLocaleString()+'G';

  const profitEl=document.getElementById('opt-profit');
  profitEl.textContent=(bestProfit>=0?'+':'')+bestProfit.toLocaleString()+'G';
  profitEl.style.color=bestProfit>0?'#4ade80':bestProfit<0?'#f87171':'';

  const recEl=document.getElementById('rec-box');
  if(bestN===0&&bestProfit<=0){recEl.className='rec-box loss';recEl.textContent='購入すると損になります。余りは次回に持ち越すか、そのまま使うことを推奨します。';}
  else if(bestN===0){recEl.className='rec-box zero';recEl.textContent='現在の所持数が最適です。追加購入は不要です。';}
  else{recEl.className='rec-box profit';recEl.textContent=`${bestN}回購入（計 ${bestCost.toLocaleString()}G）すると変換後 ${bestG.toLocaleString()}G となり、純利益 +${bestProfit.toLocaleString()}G で最大になります。`+(bestRem>0?` 余り ${bestRem} 個は保存推奨。`:'');}
}
calc();
</script>
</body>
</html>
